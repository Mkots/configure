[tasks.diff]
description = "Show what chezmoi apply would change in $HOME"
run = "chezmoi diff"

[tasks.apply]
description = "Apply the chezmoi source state to $HOME"
run = "chezmoi apply"

[tasks.lint]
description = "Shellcheck every rendered chezmoiscript"
run = '''
for f in home/.chezmoiscripts/*; do
    rendered="$(chezmoi --source . execute-template < "$f")"
    if [ -n "$rendered" ]; then
        echo "$rendered" | shellcheck -
    fi
done
'''

[tasks.update]
description = "Upgrade tools, refresh the mise lockfile, and re-apply"
run = [
    "mise upgrade",
    "mise lock",
    "chezmoi re-add ~/.config/mise/mise.lock",
    "chezmoi apply",
]

[tasks.ci]
description = "Everything CI runs: lint plus a verify that the source state is fully applied"
depends = ["lint"]
run = "chezmoi verify"
