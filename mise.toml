# Tools needed to maintain this repo, not to configure a machine. Machine tools
# live in home/dot_config/mise/config.toml.
[tools]
shellcheck = "0.11.0"

# Every task passes --source . on purpose. Without it chezmoi falls back to
# ~/.local/share/chezmoi, so a second clone on the machine would silently make
# these tasks operate on the wrong source state.

[tasks.diff]
description = "Show what chezmoi apply would change in $HOME"
run = "chezmoi --source . diff"

[tasks.apply]
description = "Apply the chezmoi source state to $HOME"
run = "chezmoi --source . apply"

[tasks.lint]
description = "Shellcheck every chezmoiscript, templated or not"
run = '''
set -eu
for f in home/.chezmoiscripts/*.sh; do
    shellcheck "$f"
done
for f in home/.chezmoiscripts/*.sh.tmpl; do
    chezmoi --source . execute-template < "$f" | shellcheck -
done
'''

[tasks.update]
description = "Bump tool versions, refresh the shared lockfile, and re-apply"
# `mise lock` defaults to the project config root — from this repo that is the
# task file above, which declares only shellcheck. --global is what reaches the
# real config. The lockfile needs no re-add: ~/.config/mise/mise.lock is a
# symlink into state/, so mise writes straight into the repo.
run = [
    "mise upgrade --bump",
    "chezmoi --source . re-add ~/.config/mise/config.toml",
    "mise lock --global",
    "mise install",
    "chezmoi --source . apply",
]

[tasks.check]
description = "Lint the scripts and verify $HOME matches the source state"
depends = ["lint"]
run = "chezmoi --source . verify"
